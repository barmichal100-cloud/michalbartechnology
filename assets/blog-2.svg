<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="חשיבה מחוץ לקופסה והתאמה אישית">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A11"/><stop offset="1" stop-color="#43291A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E3A45C" stop-opacity="0.20"/><stop offset="1" stop-color="#E3A45C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#E3A45C" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <!-- box with inner grid (top-right cell empty) -->
  <g transform="translate(170,96)">
    <rect x="0" y="0" width="230" height="230" rx="18" fill="none" stroke="#E3A45C" stroke-width="2" opacity="0.85"/>
    <g fill="#E3A45C" opacity="0.55">
      <rect x="34" y="34" width="46" height="46" rx="9"/>
      <rect x="150" y="34" width="46" height="46" rx="9" opacity="0.25"/>
      <rect x="34" y="150" width="46" height="46" rx="9"/>
      <rect x="92" y="92" width="46" height="46" rx="9"/>
      <rect x="150" y="150" width="46" height="46" rx="9"/>
    </g>
  </g>
  <!-- the escaped square + dashed trail -->
  <path d="M405,150 C 445,120 470,108 505,104" stroke="#E3A45C" stroke-width="2" fill="none" stroke-dasharray="5 7" opacity="0.7"/>
  <rect x="505" y="78" width="56" height="56" rx="12" fill="#C2683F"/>
  <path d="M524 106 l8 8 l16 -18" stroke="#F3E9D9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- personalization: a piece fitting exactly into a notch -->
  <g transform="translate(760,120)">
    <path d="M0,0 H150 V52 a30,30 0 0 0 0,76 V180 H0 Z" fill="#3A2417" stroke="#E3A45C" stroke-width="1.8"/>
    <circle cx="150" cy="90" r="30" fill="#C2683F"/>
    <rect x="34" y="44" width="80" height="12" rx="6" fill="#F3E9D9" opacity="0.4"/>
    <rect x="34" y="74" width="60" height="12" rx="6" fill="#F3E9D9" opacity="0.24"/>
    <rect x="34" y="118" width="90" height="12" rx="6" fill="#F3E9D9" opacity="0.24"/>
  </g>
</svg>
