<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="אוטומציה, יעילות וצמיחה">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A11"/><stop offset="1" stop-color="#43291A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.30" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#E3A45C" stop-opacity="0.20"/><stop offset="1" stop-color="#E3A45C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#E3A45C" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- gear 1 (big) -->
  <g fill="#E3A45C">
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(0 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(45 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(90 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(135 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(180 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(225 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(270 280 232)"/>
    <rect x="269" y="146" width="22" height="30" rx="5" transform="rotate(315 280 232)"/>
  </g>
  <circle cx="280" cy="232" r="62" fill="#3A2417" stroke="#E3A45C" stroke-width="12"/>
  <circle cx="280" cy="232" r="19" fill="#E3A45C"/>

  <!-- gear 2 (small) -->
  <g fill="#C2683F">
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(22 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(67 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(112 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(157 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(202 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(247 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(292 392 150)"/>
    <rect x="383" y="92" width="18" height="24" rx="4" transform="rotate(337 392 150)"/>
  </g>
  <circle cx="392" cy="150" r="40" fill="#3A2417" stroke="#C2683F" stroke-width="10"/>
  <circle cx="392" cy="150" r="13" fill="#C2683F"/>

  <!-- growth: ascending bars + rising arrow -->
  <g fill="#E3A45C">
    <rect x="792" y="262" width="46" height="72" rx="8" opacity="0.55"/>
    <rect x="858" y="222" width="46" height="112" rx="8" opacity="0.7"/>
    <rect x="924" y="176" width="46" height="158" rx="8" opacity="0.85"/>
    <rect x="990" y="120" width="46" height="214" rx="8"/>
  </g>
  <path d="M792 300 L865 250 L935 205 L1030 132" fill="none" stroke="#F3E9D9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M1030 132 l-26 4 m26 -4 l-6 26" fill="none" stroke="#F3E9D9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M1055 96 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5 Z" fill="#F3E9D9" opacity="0.85"/>
</svg>
