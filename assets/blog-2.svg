<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="חשיבה מחוץ לקופסה והתאמה אישית">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A11"/><stop offset="1" stop-color="#43291A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#E3A45C" stop-opacity="0.20"/><stop offset="1" stop-color="#E3A45C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#E3A45C" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <!-- open box with remaining squares -->
  <g transform="translate(170,120)">
    <path d="M0,30 V210 H210 V30" fill="none" stroke="#E3A45C" stroke-width="2.2" opacity="0.85"/>
    <path d="M0,30 H210" fill="none" stroke="#E3A45C" stroke-width="2" stroke-dasharray="6 8" opacity="0.45"/>
    <g fill="#E3A45C" opacity="0.4">
      <rect x="34" y="78" width="46" height="46" rx="9"/>
      <rect x="34" y="146" width="46" height="46" rx="9"/>
      <rect x="130" y="146" width="46" height="46" rx="9"/>
    </g>
  </g>
  <!-- square breaking out, upward -->
  <rect x="246" y="46" width="56" height="56" rx="13" fill="#C2683F"/>
  <path d="M262 66 l7 7 l14 -16" stroke="#F3E9D9" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#E3A45C" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="118" x2="256" y2="136"/>
    <line x1="274" y1="120" x2="274" y2="144"/>
    <line x1="292" y1="118" x2="292" y2="136"/>
  </g>
  <path d="M330,44 l5,13 l13,5 l-13,5 l-5,13 l-5,-13 l-13,-5 l13,-5 Z" fill="#F3E9D9" opacity="0.85"/>
  <!-- personalization: tuned sliders -->
  <g transform="translate(720,150)">
    <g stroke="#E3A45C" stroke-width="3" stroke-linecap="round" opacity="0.32">
      <line x1="0" y1="0" x2="330" y2="0"/>
      <line x1="0" y1="60" x2="330" y2="60"/>
      <line x1="0" y1="120" x2="330" y2="120"/>
    </g>
    <circle cx="228" cy="0" r="17" fill="#E3A45C"/>
    <circle cx="108" cy="60" r="17" fill="#C2683F"/>
    <circle cx="280" cy="120" r="17" fill="#E3A45C"/>
  </g>
</svg>
